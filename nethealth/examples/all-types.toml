# Every check type, aimed at loopback or invalid hosts so it is safe to open.


name = "schema-reference"
timeout_seconds = 2.0
warn_tls_days = 14

[[checks]]
name = "icmp-example"
type = "icmp"
host = "127.0.0.1"

[[checks]]
name = "tcp-example"
type = "tcp"
host = "127.0.0.1"
port = 9

[[checks]]
name = "dns-example"
type = "dns"
query = "localhost"
record = "A"
# expect = ["127.0.0.1"]

[[checks]]
name = "http-example"
type = "http"
url = "http://127.0.0.1:9/"
expect_status = 200

[[checks]]
name = "tls-example"
type = "tls"
host = "127.0.0.1"
port = 443
warn_days = 14
