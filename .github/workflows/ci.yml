name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: nethealth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        shell: bash
        run: python -m pytest -q

      # Runs the real CLI end to end. ICMP is not guaranteed on hosted runners, so this
      # asserts the report is well formed and the exit code is a defined one rather than
      # requiring every probe to pass.
      - name: Smoke test the CLI
        shell: bash
        run: |
          python -m nethealth --version
          python - <<'PY'
          import json, subprocess, sys

          run = subprocess.run(
              [sys.executable, "-m", "nethealth", "check", "-c", "examples/lab.toml", "--format", "json"],
              capture_output=True, text=True,
          )
          assert run.returncode in (0, 1), f"unexpected exit {run.returncode}: {run.stderr}"
          assert "Traceback" not in run.stderr, run.stderr
          report = json.loads(run.stdout)
          assert report["summary"]["total"] == 2, report["summary"]
          print("smoke ok:", report["summary"])

          bad = subprocess.run(
              [sys.executable, "-m", "nethealth", "check", "-c", "does-not-exist.toml"],
              capture_output=True, text=True,
          )
          assert bad.returncode == 2, bad.returncode
          assert "Traceback" not in bad.stderr, bad.stderr
          print("config error path ok")
          PY
